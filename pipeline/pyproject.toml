[project]
name = "alergia-pipeline"
version = "0.1.0"
description = "Pipeline de datos de AlergIA Madrid (DATAMAD 2026)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "pyproj>=3.8.0",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alergia", "estatico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
